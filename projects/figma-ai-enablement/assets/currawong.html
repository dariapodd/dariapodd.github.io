<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#83916d" />
    <title>Biscuit Motion</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #83916d;
        font-family: Arial, Helvetica, sans-serif;
      }

      #canvas {
        position: fixed;
        inset: 0;
        overflow: hidden;
        cursor: crosshair;
        touch-action: manipulation;
        user-select: none;
      }

      #stage {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }

      .hint {
        position: absolute;
        z-index: 100000;
        left: 50%;
        top: 50%;
        margin: 0;
        transform: translate(-50%, -50%);
        color: #fff;
        font-size: 16px;
        line-height: 1.2;
        white-space: nowrap;
        transition: opacity 158ms cubic-bezier(0.5, 0, 0.5, 1);
        pointer-events: none;
      }

      #stage.has-played .hint {
        opacity: 0;
      }

      .scene,
      .beak,
      .biscuit,
      .bird,
      .layer,
      .rot-box,
      .rot-inner,
      .fill-img {
        position: absolute;
        pointer-events: none;
      }

      .scene {
        width: 258.5px;
        height: 132px;
        transform-origin: 50% 50%;
      }

      .scene.mirrored {
        transform: scaleX(-1);
      }

      .scene.mirrored .biscuit-face {
        transform: scaleX(-1);
        transform-origin: 50% 50%;
      }

      .beak {
        z-index: 1;
        transform-origin: 100% 50%;
      }

      .biscuit {
        z-index: 2;
        inset: 0;
      }

      .bird {
        z-index: 3;
      }

      .rot-box {
        display: flex;
        align-items: center;
        justify-content: center;
        inset: 0;
      }

      .rot-inner {
        position: relative;
        flex: none;
      }

      .fill-img {
        overflow: visible;
      }

      .fill-img img,
      .rot-inner > img,
      .layer > img,
      .biscuit-face {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-drag: none;
      }

      .rot-inner > img,
      .layer > img {
        position: absolute;
        inset: 0;
      }

      .biscuit-face {
        width: 258.5px;
        height: 132px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .hint {
          transition: none;
        }
      }
    </style>
  </head>

function visualBounds(...roots) {
  let left = Infinity
  let right = -Infinity
  roots.forEach(root => {
    for (const node of [root, ...root.querySelectorAll('.layer, .rot-inner')]) {
      const box = node.getBoundingClientRect()
      left = Math.min(left, box.left)
      right = Math.max(right, box.right)
    }
  })
  return { left, right }
}

function extraOffscreenX(beak, bird, mirrored) {
  const { left, right } = visualBounds(beak, bird)
  const overflow = mirrored ? right : window.innerWidth - left
  return Math.max(0, overflow + 2) / getScale()
}

function flyKeyframes(startX) {
  const start = `${startX}px 0px`
  return [
    { offset: 0, translate: start, easing: 'linear' },
    { offset: 0.31655, translate: start, easing: 'linear' },
    { offset: 0.4626, translate: '-751px -210px', easing: 'linear' },
    { offset: 0.49886, translate: '-751px -210px', easing: 'linear' },
    { offset: 0.53553, translate: '-892px -120px', easing: FLY_SPRING },
    { offset: 0.9787, translate: '174px -120px', easing: 'linear' },
    { offset: 1, translate: '174px -120px' },
  ]
}

function animateGrab(biscuit, beak, bird, pupil, startX) {
  biscuit.style.willChange = 'opacity, translate'
  beak.style.willChange = 'transform, translate'
  bird.style.willChange = 'translate'
  pupil.style.willChange = 'translate'

  biscuit.animate([
    { offset: 0, opacity: 0, easing: 'linear' },
    { offset: 0.0217, opacity: 0, easing: DROP_SPRING },
    { offset: 0.05175, opacity: 1, easing: 'linear' },
    { offset: 1, opacity: 1 },
  ], options)
  biscuit.animate([
    { offset: 0, translate: '0px -60px', easing: 'linear' },
    { offset: 0.0217, translate: '0px -60px', easing: DROP_SPRING },
    { offset: 0.26212, translate: '0px 0px', easing: 'linear' },
    { offset: 0.53553, translate: '0px 0px', easing: FLY_SPRING },
    { offset: 0.9787, translate: '1066px 0px', easing: 'linear' },
    { offset: 1, translate: '1066px 0px' },
  ], options)

  const fly = flyKeyframes(startX)
  const flight = bird.animate(fly, options)
  beak.animate(fly, options)
  beak.animate([
    { offset: 0, transform: 'rotate(0deg)', easing: 'linear' },
    { offset: 0.4626, transform: 'rotate(0deg)', easing: SNAP },
    { offset: 0.49886, transform: 'rotate(-31.373deg)', easing: SNAP },
    { offset: 0.53553, transform: 'rotate(-9.404deg)', easing: 'linear' },
    { offset: 1, transform: 'rotate(-9.404deg)' },
  ], options)
  pupil.animate([
    { offset: 0, translate: '0px 0px', easing: 'linear' },
    { offset: 0.4626, translate: '0px 0px', easing: 'linear' },
    { offset: 0.49886, translate: '-6.505px 1.096px', easing: 'linear' },
    { offset: 1, translate: '-6.505px 1.096px' },
  ], options)
  return flight
}

window.addEventListener('resize', layoutStage)
canvas.addEventListener('click', event => {
  const scale = getScale()
  addDrop(event.clientX / scale, event.clientY / scale)
})

// Portfolio embed: play by itself, dropping a biscuit at a random spot near the centre every second.
// Pauses while the tab is hidden; off for people who prefer reduced motion.
if (!reduceMotion.matches) {
  setInterval(() => {
    if (document.hidden) return
    const visibleH = window.innerHeight / getScale()
    const x = FRAME_W / 2 + (Math.random() - 0.5) * 360
    const y = visibleH / 2 + (Math.random() - 0.5) * 220
    addDrop(x, y)
  }, 1000)
}
