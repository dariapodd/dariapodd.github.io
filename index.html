<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daria Podrezova: Product Designer, AI &amp; enterprise domains</title>
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/KodeMono.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Kode Mono, self-hosted (full character set, incl. the → arrow). License: fonts/OFL.txt */
  @font-face {
    font-family: "Kode Mono";
    src: url("fonts/KodeMono.ttf") format("truetype");
    font-weight: 400 700;
    font-display: swap;
  }
</style>
<style>
  :root {
    --bg: #21211d;
    --ink: #dddcc8;
    --panel: rgba(58, 57, 56, 0.2);
    --border: #4c4c4a;
    --button: #c8bfb3;
    --button-ink: #403524;
    --shadow: 0 4px 72px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Kode Mono", ui-monospace, monospace;
  }

  .card {
    width: min(540px, 100%);
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin: 0;
    padding: 48px clamp(20px, 6vw, 63px);
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
  }

  .title {
    width: 100%;
    margin: 0 0 32px; /* legend isn't a flex item, so it sets its own gap */
    padding: 0;
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    font-weight: 400;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
    border: 0;
  }

  .option {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 24px;
    border: 1px solid transparent; /* keeps size stable when selected */
    border-radius: 12px;
    cursor: pointer;
  }
  .option:hover { background: rgba(58, 57, 56, 0.12); }
  .option:hover .name { font-weight: 600; } /* title only, not the description */
  .option:has(input:checked) {
    background: var(--panel);
    border-color: var(--border);
    box-shadow: var(--shadow);
  }
  .option:has(input:focus-visible) {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* Native radios stay for keyboard + screen readers, visually hidden */
  .option input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .name {
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .desc {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 300;
    font-size: 14px;
    line-height: 1.4;
  }
  .desc a { color: inherit; }

  .go {
    width: 100%;
    padding: 12px 32px;
    border: 0;
    border-radius: 12px;
    background: var(--button);
    color: var(--button-ink);
    font: 400 16px/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .go:hover:not(:disabled) { font-weight: 600; }
  .go:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  /* Figma-style 100% corner smoothing: 12px radius spread over 24px as a squircle */
  @supports (corner-shape: squircle) {
    .card,
    .option,
    .go {
      border-radius: 24px;
      corner-shape: squircle;
    }
  }
  .go:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <form class="card" id="selector">
    <fieldset class="options">
      <legend class="title">select portfolio style:</legend>

      <label class="option">
        <input type="radio" name="style" value="enterprise/">
        <span class="name">enterprise</span>
        <span class="desc">Normal, recommended</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="caveman">
        <span class="name">caveman</span>
        <span class="desc">Very succinct, inspired by <a href="https://dev.to/onsen/caveman-claude-the-token-cutting-skill-thats-changing-ai-workflows-4hmc" target="_blank" rel="noopener">this skill</a></span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="startup">
        <span class="name">startup</span>
        <span class="desc">The one with emojis</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="elevator-pitch/" checked>
        <span class="name">eternal elevator pitch</span>
        <span class="desc">Imagine yourself in a lift in an endlessly tall building...</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="json/">
        <span class="name">json</span>
        <span class="desc">Works best if you’re a robot</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="resume-daria-podrezova.pdf">
        <span class="name">go straight to resume</span>
        <span class="desc">View and download PDF</span>
      </label>
    </fieldset>

    <button class="go" type="submit">Go →</button>
  </form>

<script>
(() => {
  // Styles that have a page so far; the rest show "Coming soon" on the button.
  const READY = new Set(["enterprise/", "elevator-pitch/", "json/", "resume-daria-podrezova.pdf"]);
  // These open in a new tab, so the selector stays open behind them.
  const NEW_TAB = new Set(["resume-daria-podrezova.pdf"]);

  const form = document.getElementById("selector");
  const go = form.querySelector(".go");
  const selected = () => form.querySelector("input[name=style]:checked");

  function update() {
    const ready = READY.has(selected().value);
    go.disabled = !ready;
    go.textContent = ready ? "Go →" : "Coming soon";
  }

  form.addEventListener("change", update);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const target = selected().value;
    if (!READY.has(target)) return;
    if (NEW_TAB.has(target)) window.open(target, "_blank", "noopener");
    else location.href = target;
  });
  // Keyboard: ↑/↓ move the selection (wrapping), Enter opens it, Esc returns to the page
  // the menu was opened from. Works without clicking into the menu first.
  const options = [...form.querySelectorAll("input[name=style]")];
  document.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const step = e.key === "ArrowDown" ? 1 : -1;
      const next = options[(options.indexOf(selected()) + step + options.length) % options.length];
      next.checked = true;
      next.focus({ preventScroll: true });
      update();
    } else if (e.key === "Enter") {
      if (e.target.closest("a")) return; // e.g. the "this skill" link opens normally
      e.preventDefault();
      form.requestSubmit();
    } else if (e.key === "Escape") {
      const from = new URLSearchParams(location.search).get("style");
      const back = from && options.find(i => i.value === from || i.value === from + "/");
      if (back && READY.has(back.value)) location.href = back.value;
      else if (document.referrer.startsWith(location.origin)) history.back();
    }
  });

  // Opened from a portfolio page (?style=json etc.): pre-select that page's style
  const from = new URLSearchParams(location.search).get("style");
  const match = from && [...form.querySelectorAll("input[name=style]")]
    .find(i => i.value === from || i.value === from + "/");
  if (match) match.checked = true;

  update();
  addEventListener("pageshow", update); // Back button restores the last pick
})();
</script>
</body>
</html>
