<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daria Podrezova: Product Designer, AI &amp; enterprise domains</title>
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300&family=Kode+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #21211d;
    --ink: #dddcc8;
    --panel: rgba(58, 57, 56, 0.2);
    --border: #4c4c4a;
    --button: #c8bfb3;
    --button-ink: #403524;
    --shadow: 0 4px 72px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Kode Mono", ui-monospace, monospace;
  }

  .card {
    width: min(540px, 100%);
    display: flex;
    flex-direction: column;
    gap: 32px;
    margin: 0;
    padding: 48px clamp(20px, 6vw, 63px);
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: var(--shadow);
  }

  .title {
    width: 100%;
    margin: 0 0 32px; /* legend isn't a flex item, so it sets its own gap */
    padding: 0;
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    font-weight: 400;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 0;
    padding: 0;
    border: 0;
  }

  .option {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 12px 24px;
    border: 1px solid transparent; /* keeps size stable when selected */
    border-radius: 12px;
    cursor: pointer;
  }
  .option:hover { background: rgba(58, 57, 56, 0.12); }
  .option:hover .name { font-weight: 600; } /* title only, not the description */
  .option:has(input:checked) {
    background: var(--panel);
    border-color: var(--border);
    box-shadow: var(--shadow);
  }
  .option:has(input:focus-visible) {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }

  /* Native radios stay for keyboard + screen readers, visually hidden */
  .option input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }

  .name {
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .desc {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 300;
    font-size: 14px;
    line-height: 1.4;
  }
  .desc a { color: inherit; }

  .go {
    width: 100%;
    padding: 12px 32px;
    border: 0;
    border-radius: 12px;
    background: var(--button);
    color: var(--button-ink);
    font: 600 16px/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .go:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .go:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <form class="card" id="selector">
    <fieldset class="options">
      <legend class="title">select portfolio style:</legend>

      <label class="option">
        <input type="radio" name="style" value="enterprise">
        <span class="name">enterprise</span>
        <span class="desc">Normal, recommended</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="caveman">
        <span class="name">caveman</span>
        <span class="desc">Very succinct, inspired by <a href="#">this skill</a></span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="startup">
        <span class="name">startup</span>
        <span class="desc">The one with emojis</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="elevator-pitch/" checked>
        <span class="name">eternal elevator pitch</span>
        <span class="desc">Imagine yourself in a lift in an endlessly tall building...</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="json">
        <span class="name">json</span>
        <span class="desc">Works best if you’re a robot</span>
      </label>

      <label class="option">
        <input type="radio" name="style" value="resume-daria-podrezova.pdf">
        <span class="name">go straight to resume</span>
        <span class="desc">View and download PDF</span>
      </label>
    </fieldset>

    <button class="go" type="submit">Go →</button>
  </form>

<script>
(() => {
  // Styles that have a page so far; the rest show "Coming soon" on the button.
  const READY = new Set(["elevator-pitch/", "resume-daria-podrezova.pdf"]);

  const form = document.getElementById("selector");
  const go = form.querySelector(".go");
  const selected = () => form.querySelector("input[name=style]:checked");

  function update() {
    const ready = READY.has(selected().value);
    go.disabled = !ready;
    go.textContent = ready ? "Go →" : "Coming soon";
  }

  form.addEventListener("change", update);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (READY.has(selected().value)) location.href = selected().value;
  });
  // Enter on a focused option goes too
  form.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input[name=style]")) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  update();
  addEventListener("pageshow", update); // Back button restores the last pick
})();
</script>
</body>
</html>
