<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages Test</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #dad9cf;
    color: #594d3c;
    font-family: ui-monospace, Consolas, monospace;
    text-align: center;
    padding: 16px;
  }
  h1 { font-size: clamp(28px, 6vw, 56px); margin: 0 0 12px; }
  p { margin: 4px 0; }
  .ok { color: #ec6039; }
</style>
</head>
<body>
  <main>
    <h1>Hello from GitHub Pages <span class="ok">✓</span></h1>
    <p>If you can see this, hosting works.</p>
    <p>Loaded: <span id="time"></span></p>
  </main>
  <script>
    document.getElementById("time").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
