<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daria Podrezova: Product Designer, AI &amp; enterprise domains</title>
<link rel="icon" href="../favicon-64.png" type="image/png" sizes="64x64">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preload" href="../fonts/KodeMono.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* Kode Mono, self-hosted (full character set, incl. the → arrow). License: fonts/OFL.txt */
  @font-face {
    font-family: "Kode Mono";
    src: url("../fonts/KodeMono.ttf") format("truetype");
    font-weight: 400 700;
    font-display: swap;
  }
</style>
<style>
  :root {
    --bg: #dad9cf;
    --ink: #403524;
    --rule: #c8bfb3;
    --pill-solid: #c8bfb3;
    --nav-ink: #594d3c;
    --accent: #9e3b02;

    /* Every size is the 1920px Figma value times --k. Sizes stay fixed at every width. */
    --k: 0.6;
    --fs: 32px;
    --lh: 36px;
    --rows: 8;
    --nav-fs: 16px;
    /* Left margin, shared by all views: content starts 160px after the vertical margin line */
    --margin-line: 26px;      /* vertical margin line, from the window's left edge */
    --content-left: 160px;    /* margin line → content (also the project number block's width) */
    --text-left: calc(var(--margin-line) + 1px + var(--content-left));
    --gutter: 53px;           /* right margin; also the left margin on phones */  }

  * { box-sizing: border-box; }

  @media (max-width: 700px) {
    :root { --content-left: 26px; } /* phones: text 53px from the edge */
  }

  html, body { margin: 0; }
  html { overflow-x: clip; } /* full-width ruled lines must never cause sideways scrolling */

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Kode Mono", ui-monospace, monospace;
    overflow-x: hidden;
  }

  /* Vertical margin rule */
  .margin-rule {
    position: fixed;
    top: 0;
    bottom: 0;
    left: var(--margin-line);
    width: 1px;
    background: var(--rule);
    pointer-events: none;
  }

  /* Selector, pitch and elevator line share one column starting at the shared left margin */
  .frame {
    width: calc(100% - var(--text-left) - var(--gutter));
    margin-left: var(--text-left);
    padding-top: 131px; /* selector sits at a fixed spot from the top, as in the JSON view */
  }

  /* ---------- "View portfolio as" selector ---------- */
  .view-select {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0 16px;
    padding: 16px 0;
    /* Pitch + elevator line are centred in the window (gap set by script), at least 64px below */
    margin-bottom: max(64px, var(--center-gap, 0px));
    color: var(--nav-ink);
    font-size: var(--nav-fs);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .view-select a {
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .view-select a:hover { font-weight: 600; }
  .view-select .arrow { margin-left: 5px; }

  /* ---------- Resume button, top right ---------- */
  .resume {
    position: fixed; /* stays in the corner while scrolling */
    z-index: 10;
    top: 32px;
    right: 32px;
    padding: 12px 32px;
    border-radius: 12px;
    background: var(--pill-solid);
    backdrop-filter: blur(16px); /* Figma background blur 32 */
    -webkit-backdrop-filter: blur(16px);
    color: var(--ink);
    font: 400 var(--nav-fs)/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
  }
  .resume:hover { font-weight: 600; }
  /* Figma: 12px radius, 100% corner smoothing. Smoothing spreads the curve over
     2x the radius, so use 24px with a squircle corner where supported. */
  @supports (corner-shape: squircle) {
    .resume {
      border-radius: 24px;
      corner-shape: squircle;
    }
  }

  /* ---------- Pitch ---------- */
  .pitch-wrap {
    position: relative;
    /* Column width comes from .frame, so typing never resizes (and shifts) it */
    width: 0;
    min-width: 100%;
  }
  /* Ruled lines, full page width, aligned to the text baseline */
  .rules {
    position: absolute;
    top: 0;
    /* from the window's left edge to its right edge, wherever the column sits */
    left: calc(-1 * var(--text-left));
    width: 100vw;
    height: calc(var(--lh) * var(--rows));
    pointer-events: none;
  }
  .rules span {
    position: absolute;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--rule);
  }

  .pitch {
    position: relative;
    width: min(calc(1279px * var(--k)), 100%);
    height: calc(var(--lh) * var(--rows));
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 calc(var(--lh) * 3.5));
            mask-image: linear-gradient(to bottom, transparent 0, #000 calc(var(--lh) * 3.5));
  }

  .pitch-text {
    font-size: var(--fs);
    line-height: var(--lh);
    letter-spacing: 0.1em;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    will-change: transform;
  }

  .pitch-text p {
    margin: 0 0 var(--lh);
  }
  .pitch-text p.ding {
    margin-bottom: calc(var(--lh) * 2); /* two empty lines after the opener */
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1em;
    margin-left: 0.05em;
    vertical-align: -0.12em;
    background: var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  .typing .cursor { animation: none; }

  .word { white-space: nowrap; }
  .ghost { visibility: hidden; }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .elevator {
    /* 64px below the last ruled line (which sits 0.23 line-heights above the pitch bottom) */
    margin: calc(64px - 0.23 * var(--lh)) 0 calc(60px * var(--k));
    font-size: 16px;
    letter-spacing: 0.1em;
    line-height: 1.2;
    text-transform: uppercase;
  }
  /* Arrow pulses from background to text colour once per level change (duration set by script) */
  .elevator .up {
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { color: var(--ink); }
    50% { color: var(--bg); }
  }
  /* Centre capitals exactly in buttons: the line box normally reserves room for accents
     above and descenders below, which leaves caps ~1px high. Trimming the box to the cap
     height lets equal padding centre them; older browsers get a 0.5px nudge instead.
     Button height stays 43.2px either way. */
  .resume, .button, .scroll-hint { padding-top: 12.5px; padding-bottom: 11.5px; }
  @supports (text-box: trim-both cap alphabetic) {
    .resume, .button, .scroll-hint {
      text-box: trim-both cap alphabetic;
      padding-top: 15.6px;
      padding-bottom: 15.6px;
    }
  }
</style>
</head>
<body>
  <div class="margin-rule" aria-hidden="true"></div>

  <a class="resume" href="../resume-daria-podrezova.pdf" target="_blank" rel="noopener">resume and contacts</a>

  <div class="frame">
  <nav class="view-select" aria-label="Portfolio style">
    <span>view portfolio as:</span>
    <a href="./" title="Choose another portfolio style">elevator pitch simulator<span class="arrow" aria-hidden="true">▼</span></a>
  </nav>
  <main class="pitch-wrap">
    <div class="rules" aria-hidden="true"></div>
    <div class="pitch">
      <div class="pitch-text" id="pitch" aria-live="off"></div>
    </div>
    <p class="elevator">Elevator level: <output id="level">G</output><span class="up" aria-hidden="true">▲</span></p>
  </main>
  </div>

<script>
(() => {
  const DING = "*ding-dong*\n\n░░░░▌▐░░░░";
  const PITCH = [
    DING,
    "Hi, I’m Daria,\nI’m a Product Designer mostly working with complex, regulated domains, Agentic AI & enterprise solutions. How I work: talk to people. Find the real problem. Map the workflow, simplify it. Prototype it so stakeholders see it, understand it, and say yes.",
    "Oh. We’re still in the elevator. Okay. Let me keep going.",
    "Regulated domains first. Finance, health, compliance-heavy everything. Places where a button isn’t just a button, it’s an audit trail. Where “move fast and break things” gets you a very polite letter from legal. I like those places. The constraints are real, so the design has to be real too.",
    "Here’s the thing about complex products: the complexity is rarely the problem. The problem is complexity that shows up at the wrong moment, for the wrong person, in the wrong order. My job is to put it back in line.",
    "So I start with people. Not personas on a slide. Actual people, doing actual work, with actual workarounds. The spreadsheet that lives next to the official tool. The sticky note on the monitor. The “oh, I just ask someone in ops.” That’s where the truth is.",
    "Then I map it. Every step, every handoff, every place someone waits for someone else. Once a workflow fits on one page, half the debates end on their own. People stop arguing about opinions and start pointing at boxes.",
    "Then I simplify. Cut steps. Merge screens. Move decisions earlier. Make the default the right answer. Simplicity in enterprise isn’t minimalism. It’s fewer ways to get it wrong.",
    "Agentic AI. Everyone wants an agent. Fewer people ask what the agent should do on its own, what it should ask about, and how a human takes the wheel back. That’s a design problem, not a model problem. I design for that.",
    "Good agent UX is mostly trust UX. Show what the agent is doing. Show why. Make it easy to check, easy to correct, easy to undo. Let confidence be visible. Let the human stay accountable without having to babysit.",
    "In regulated spaces that matters twice. An agent that drafts a report is helpful. An agent that files it without anyone noticing is a headline. I’d rather design the review step than the apology.",
    "Prototypes. I prototype early and I prototype a lot. Clickable, realistic, a little rough if needed. A stakeholder who can click through a flow understands it in two minutes. The same flow in a forty-page spec takes two weeks and three meetings.",
    "A prototype is also the fastest way to find out I’m wrong. I like finding out I’m wrong early. It’s cheap then.",
    "Floor check. Still going up? Great.",
    "On teams: I work closely with engineering. I’d rather hear “that’s hard” in week one than “that’s impossible” in week ten. I sit in on technical discussions, I ask about data models, I care where the API ends.",
    "With product managers, I bring options and trade-offs, not one shiny screen. With leadership, I bring the story: what’s broken, what it costs, what changes if we fix it.",
    "With users, I mostly listen. Then I come back with something they can touch.",
    "Design systems: yes, please. Enterprise products live for years and get built by many hands. A good system keeps them consistent when nobody is looking. A great one makes the right pattern the easy one.",
    "Accessibility isn’t a phase. It’s part of done. Same for error states, empty states, loading states, and the state where the session expired at 4:58 on a Friday.",
    "Data-heavy screens are my comfort zone. Tables with forty columns. Filters on filters. Dashboards someone stares at for eight hours a day. Those deserve care, because that someone deserves a good day.",
    "What I’m not: a decorator. Pretty is nice. Clear is better. Clear and pretty is the goal, in that order.",
    "What I watch after launch: Did the task get faster? Did errors drop? Did support tickets go quiet? Did people stop keeping the side spreadsheet? That last one is my favourite metric.",
    "Still here. Still pitching. The elevator, apparently, has no top floor.",
    "Quick summary, in case you just got on: Talk to people. Find the real problem. Map the workflow. Simplify it. Prototype it. Get the yes. Ship it. Watch it get used. Repeat.",
    "If this sounds like what your team needs, resume and contacts are right up there, top right. Press it anytime. I’ll keep talking either way.",
    "…",
    "Right. From the top, then."
  ];

  // Pacing: raise to slow down, lower to speed up
  const TYPE_SLOWDOWN = 1.5;  // multiplies every typing delay and pause
  const LEVEL_MS = 3000;      // elevator level changes every 3s

  const ROWS = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--rows"), 10);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const textEl = document.getElementById("pitch");
  const viewport = textEl.parentElement;
  const rulesEl = document.querySelector(".rules");
  const levelEl = document.getElementById("level");
  const upArrow = document.querySelector(".elevator .up");
  upArrow.style.animationDuration = LEVEL_MS + "ms";
  // Restart the pulse on each level change so the arrow is brightest as the number changes
  const restartPulse = () => upArrow.getAnimations().forEach(a => { a.currentTime = 0; });

  // ---- Ruled lines ----
  for (let i = 0; i < ROWS; i++) {
    rulesEl.appendChild(document.createElement("span"));
  }
  function placeRules() {
    const lh = parseFloat(getComputedStyle(textEl).lineHeight);
    [...rulesEl.children].forEach((s, i) => {
      s.style.top = (i * lh + lh * 0.77 - 1) + "px";
    });
  }
  placeRules();
  addEventListener("resize", placeRules);
  document.fonts && document.fonts.ready.then(placeRules);

  // ---- Vertical centring of the pitch + elevator line (selector stays at the top) ----
  const viewSelect = document.querySelector(".view-select");
  const elevator = document.querySelector(".elevator");
  function centerBlock() {
    const blockH = elevator.getBoundingClientRect().bottom - viewport.getBoundingClientRect().top;
    const selectorBottom = viewSelect.getBoundingClientRect().bottom + scrollY;
    const gap = (document.documentElement.clientHeight - blockH) / 2 - selectorBottom;
    viewSelect.style.setProperty("--center-gap", gap + "px");
  }
  centerBlock();
  addEventListener("resize", centerBlock);
  new ResizeObserver(centerBlock).observe(viewSelect);
  document.fonts && document.fonts.ready.then(centerBlock);

  // ---- Elevator counter: G, 1, 2, 3 … every 2s ----
  let level = 0;
  setInterval(() => {
    level++;
    levelEl.textContent = level;
    restartPulse();
  }, LEVEL_MS);

  // ---- Typing ----
  const cursor = document.createElement("span");
  cursor.className = "cursor";

  // The untyped rest of the current word sits invisibly after the cursor, and the
  // word (typed part + cursor + rest) can't break, so the browser wraps the whole
  // word before its first letter is typed instead of jumping mid-word.
  const ghost = document.createElement("span");
  ghost.className = "ghost";
  const restOfWord = (para, i) => para.slice(i).match(/^\S*/)[0];

  let pIndex = 0;
  let charIndex = 0;
  let doneNode = null;  // finished words of the current paragraph
  let wordNode = null;  // typed part of the current word

  function startParagraph() {
    const p = document.createElement("p");
    if (PITCH[pIndex] === DING) p.className = "ding";
    doneNode = document.createTextNode("");
    wordNode = document.createTextNode("");
    const word = document.createElement("span");
    word.className = "word";
    word.append(wordNode, cursor, ghost);
    p.append(doneNode, word);
    textEl.appendChild(p);
    ghost.textContent = restOfWord(PITCH[pIndex], 0);
  }

  function delayFor(ch, next) {
    return TYPE_SLOWDOWN * baseDelay(ch, next);
  }
  function baseDelay(ch, next) {
    if (".?!…".includes(ch) && (next === " " || next === undefined || next === "\n")) return 380 + Math.random() * 220;
    if (",:;".includes(ch)) return 160 + Math.random() * 100;
    if (ch === "\n") return 300;
    return 24 + Math.random() * 38;
  }

  function tick() {
    const para = PITCH[pIndex];
    if (charIndex === 0 && doneNode.length + wordNode.length > 0) startParagraph();

    const ch = para[charIndex];
    if (/\s/.test(ch)) {
      doneNode.appendData(wordNode.data + ch);
      wordNode.data = "";
    } else {
      wordNode.appendData(ch);
    }
    charIndex++;
    ghost.textContent = restOfWord(para, charIndex);

    if (charIndex >= para.length) {
      pIndex = (pIndex + 1) % PITCH.length;
      charIndex = 0;
      textEl.classList.remove("typing");
      setTimeout(() => { textEl.classList.add("typing"); tick(); }, TYPE_SLOWDOWN * (900 + Math.random() * 500));
      return;
    }
    setTimeout(tick, delayFor(ch, para[charIndex]));
  }

  // ---- Smooth scroll-up ----
  // The last line of text always sits on the bottom row, so typing happens at
  // the bottom from the very first character (offset is negative until the box fills).
  let offset = null;
  let last = performance.now();

  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;

    const target = textEl.scrollHeight - viewport.clientHeight;
    if (offset === null) offset = target;
    offset = reduceMotion ? target : offset + (target - offset) * (1 - Math.exp(-dt * 7));
    if (Math.abs(target - offset) < 0.1) offset = target;

    // Drop paragraphs that have scrolled fully out of view
    const first = textEl.firstElementChild;
    const second = first && first.nextElementSibling;
    if (second && second.offsetTop < offset - 4) {
      const removed = second.offsetTop - first.offsetTop;
      first.remove();
      offset -= removed;
    }

    textEl.style.transform = `translateY(${-offset}px)`;
    requestAnimationFrame(frame);
  }

  textEl.classList.add("typing");
  startParagraph();
  requestAnimationFrame(frame);
  setTimeout(tick, TYPE_SLOWDOWN * 600);
})();
</script>
<script src="../menu.js" defer data-current="elevator-pitch"></script>
</body>
</html>
