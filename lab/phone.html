<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone mockup lab</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon-64.png" type="image/png" sizes="64x64">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Kode Mono";
    src: url("../fonts/KodeMono.ttf") format("truetype");
    font-weight: 400 700;
    font-display: swap;
  }
  :root {
    --bg: #191613;          /* project body, black variant */
    --panel: #21211d;
    --ink: #dddcc8;
    --muted: rgba(221, 220, 200, 0.55);
    --accent: #00ffcc;
    --rule: #3d414a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid;
    grid-template-columns: 1fr 320px;
    background: var(--bg);
    color: var(--ink);
    font: 300 13px/1.4 "Chakra Petch", system-ui, sans-serif;
  }
  .hint {
    position: absolute; left: 16px; bottom: 12px; margin: 0;
    color: var(--muted); pointer-events: none;
  }

  .panel {
    overflow-y: auto;
    padding: 20px 20px 32px;
    border-left: 1px solid var(--rule);
    background: var(--panel);
  }
  h1, h2 {
    margin: 0;
    font: 400 13px/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  h1 { color: var(--accent); margin-bottom: 4px; }
  h2 { margin: 24px 0 10px; color: var(--muted); }
  .panel p { margin: 0; color: var(--muted); }
  .control { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-bottom: 10px; }
  .control label { color: var(--ink); }
  .control output { font: 400 12px/1.4 "Kode Mono", ui-monospace, monospace; color: var(--accent); }
  .control input[type="range"], .control select { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
  .control select {
    padding: 6px 8px;
    border: 1px solid var(--rule);
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  .control.is-check { grid-template-columns: auto 1fr; align-items: center; }
  .control.is-check input { margin: 0; accent-color: var(--accent); }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1;
    padding: 10px 12px;
    border: 0;
    border-radius: 12px;
    background: rgba(0, 255, 204, 0.1);
    color: var(--accent);
    font: 400 12px/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:hover { font-weight: 600; }
  .file-name { margin-top: 8px; word-break: break-all; }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    min-height: 0;
    overflow: hidden;
    background-image: linear-gradient(45deg, #6e6f74, #202022);
  }
  .stage.is-plain { background: var(--bg); }
  .stage.is-plain .background-panels { display: none; }
  /* Drop target highlight */
  .stage.is-dropping::after {
    content: "Drop your screen";
    position: absolute;
    inset: 16px;
    z-index: 20;
    display: grid;
    place-items: center;
    border: 2px dashed var(--accent);
    border-radius: 24px;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent);
    font: 400 16px/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    pointer-events: none;
  }

  /* ---------- Phone ----------
     Pure CSS phone after "Photorealistic pure CSS mobile phone" by Wujek_Greg
     (https://codepen.io/Wujek_Greg/pen/LmrweG). The demo app on the display is replaced
     by a dropped image; the body, buttons, speakers and reflections are the pen's. */
  .background-panels {
    position: absolute;
    top: 50%;
    left: 50%;
    display: flex;
    width: 1800px;
    border: 2px solid #0f0f0f;
    flex-wrap: wrap;
    transform: translate(-50%, -50%) rotate(-30deg) skewX(30deg);
  }
  .background-panels div {
    height: 500px;
    width: 580px;
    border: 2px solid #0f0f0f;
    box-shadow: inset 3px 0 0px -1px #4b4c4f, inset 0 -3px 1px -1px #424346, inset 0 -4px 0 -1px #353639, inset 5px 0 1px -1px rgba(182,182,190,0.6), inset 0 -5px 1px -1px rgba(182,182,190,0.2);
  }
  .phone {
    --scale: 0.8;
    position: absolute;
    left: calc(50% - 8px);
    top: calc(50% - 2px);
    transform: translate(-50%, -50%) rotate(-30deg) skewX(30deg) scale(var(--scale));
  }
  .phone.is-flat { transform: translate(-50%, -50%) scale(var(--scale)); }
  .phone-back {
    position: absolute;
    top: -3px;
    transform: translate(-50%, -50%);
    height: 734px;
    width: 430px;
    background-image: linear-gradient(to bottom, #3a3b3f 70%, #1d1d1f);
    border-radius: 74px 40px 84px 50px;
    box-shadow: -26px 8px 8px -10px rgba(0,0,0,0.3), -6px 6px 6px 0 rgba(0,0,0,0.6), -30px 14px 10px -10px rgba(0,0,0,0.5), -20px 40px 8px 0 rgba(0,0,0,0.1), -20px 30px 8px 0 rgba(0,0,0,0.1), inset 20px 0 15px -6px rgba(0,0,0,0.6), inset 2px 0 4px -2px rgba(0,0,0,0.6), inset 2px 0 1px -2px rgba(255,255,255,0.1), inset 0 -15px 10px -10px rgba(255,255,255,0.15);
  }
  .phone-back:before {
    content: "";
    display: block;
    height: 300px;
    width: 100px;
    position: absolute;
    background-color: #fff;
    left: 16px;
    bottom: 40px;
    border-radius: 20px;
    filter: blur(5px);
    opacity: 0.1;
    transform: rotate(4deg);
  }
  .phone-back:after {
    content: "";
    display: block;
    height: 300px;
    width: 100px;
    position: absolute;
    background-color: #fff;
    left: 26px;
    bottom: 40px;
    border-radius: 20px;
    filter: blur(4px);
    opacity: 0.25;
    transform: rotate(2deg);
  }
  .phone-screen {
    position: absolute;
    top: -16px;
    left: 14px;
    transform: translate(-50%, -50%);
    height: 710px;
    width: 400px;
    background-color: #000;
    border-radius: 48px 40px 52px 45px;
    box-shadow: -2px 0 0px -1px rgba(255,255,255,0.4), -1px 3px 3px -3px rgba(255,255,255,0.7);
  }
  .phone-display {
    position: absolute;
    z-index: 1;
    top: -23px;
    left: 20px;
    transform: translate(-50%, -50%);
    height: 690px;
    width: 378px;
    background-color: #fbfbfb;
    border-radius: 45px 37px 41px 41px;
  }
  .phone-notch {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translate(-50%);
    width: 210px;
    background-color: #131313;
    border-top: 6px solid #000;
    height: 21px;
    z-index: 3;
    border-radius: 0 0 20px 20px;
  }
  .phone.no-notch .phone-notch { display: none; }
  .phone-notch:after {
    content: "";
    display: block;
    height: 12px;
    width: 12px;
    background-color: transparent;
    position: absolute;
    left: -12px;
    top: -5px;
    border-radius: 50%;
    box-shadow: 5px -5px 0 -3px #000;
  }
  .phone-notch:before {
    content: "";
    display: block;
    height: 12px;
    width: 12px;
    background-color: transparent;
    position: absolute;
    right: -12px;
    top: -5px;
    border-radius: 50%;
    box-shadow: -4px -4px 0 -3px #000;
  }
  .phone-speaker {
    position: absolute;
    top: 6px;
    width: 58px;
    height: 6px;
    border-radius: 20px;
    background-color: #2b2b2b;
    overflow: hidden;
    box-shadow: 0 0 0 1px #363637, inset -3px 3px 1px 0px #000, inset -3px 4px 0px -1px rgba(255,255,255,0.5);
    left: 50%;
    transform: translateX(-50%);
  }
  .phone-speaker:after {
    content: "";
    display: block;
    height: 4px;
    width: 4px;
    background-color: #87888c;
    position: absolute;
    right: -1px;
    border-radius: 50%;
    top: -1px;
  }
  .phone-speaker:before {
    content: "";
    display: block;
    height: 4px;
    width: 4px;
    background-color: #898a8e;
    position: absolute;
    right: -2px;
    border-radius: 50%;
    top: 4px;
  }
  .phone-left-side {
    position: absolute;
    left: 0;
    top: 60px;
    width: 30px;
    height: 100%;
  }
  .phone-left-side .phone-antena {
    position: absolute;
    height: 20px;
    width: 50px;
    left: -5px;
    top: 10px;
    border-radius: 50%;
    transform: rotate(-40deg) skewX(20deg);
    background-color: transparent;
    box-shadow: 0px -2px 1px -2px #000;
  }
  .phone-left-side .phone-antena.bottom {
    top: auto;
    bottom: 128px;
  }
  .phone-left-side .phone-antena:after {
    content: "";
    display: block;
    height: 20px;
    width: 50px;
    position: absolute;
    transform: rotate(-2deg);
    left: -5px;
    top: 3px;
    border-radius: 50%;
    background-color: transparent;
    box-shadow: 0px -2px 1px -2px #000;
  }
  .phone-button {
    position: absolute;
    top: 100px;
    left: 4px;
    height: 47px;
    width: 12px;
    background-color: #010101;
    border-radius: 30px;
    transform: skewY(-40deg);
    box-shadow: -32px -16px 10px 0 rgba(0,0,0,0.4), -4px 0 4px 0 rgba(0,0,0,0.4);
  }
  .phone-button.bottom {
    top: 160px;
  }
  .phone-button.top {
    top: 48px;
    height: 29px;
    width: 14px;
    left: 2px;
    border-radius: 10px 10px 10px 3px;
    box-shadow: inset 2px 0 0 -1px rgba(255,255,255,0.25);
  }
  .phone-button.top:after {
    height: 27px;
    width: 8px;
    left: 4px;
    top: 0px;
  }
  .phone-button.top:before {
    height: 28px;
    width: 8px;
    left: 6px;
    top: 0px;
    box-shadow: 1px 0 0 0 rgba(0,0,0,0.4);
  }
  .phone-button:before {
    content: "";
    display: block;
    position: absolute;
    height: 45px;
    width: 10px;
    background-image: linear-gradient(to bottom, #6a6b6f 85%, #0b0b0b);
    border-radius: 20px;
  }
  .phone-button:after {
    content: "";
    display: block;
    position: absolute;
    left: -2px;
    top: -1px;
    height: 44px;
    width: 10px;
    background-color: #2d2d2f;
    border-radius: 20px;
    box-shadow: inset -1px -1px 0 -1px rgba(255,255,255,0.6);
  }
  .phone-bottom {
    position: absolute;
    bottom: 0;
    width: 100%;
  }
  .phone-bottom .bottom-speaker {
    position: absolute;
    display: flex;
    left: calc(50% - 120px);
    bottom: 6px;
    transform: skewX(-50deg);
  }
  .phone-bottom .bottom-speaker.right {
    left: calc(50% + 45px);
  }
  .phone-bottom .bottom-speaker div {
    height: 6px;
    width: 6px;
    background-color: #212121;
    box-shadow: inset -4px -3px 2px -2px #000, 1px -1px 0 -1px rgba(255,255,255,0.5);
    margin: 0 3px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
  }
  .phone-bottom .bottom-speaker div:after {
    content: "";
    display: block;
    height: 3px;
    width: 3px;
    background-color: #fff;
    border-radius: 50%;
    position: absolute;
    bottom: -1px;
    left: 3px;
    opacity: 0.4;
  }
  .phone-bottom .phone-screw {
    position: absolute;
    bottom: 5px;
    left: calc(50% - 38px);
    height: 9px;
    width: 9px;
    background-image: linear-gradient(to right, #1a1a1c 30%, #a1a2a7 60%, #1a1a1c 80%);
    border-radius: 50%;
    transform: translateX(-50%) skewX(-50deg);
  }
  .phone-bottom .phone-screw.right {
    left: calc(50% + 36px);
  }
  .phone-bottom .phone-screw div {
    height: 6px;
    width: 6px;
    border-radius: 50%;
    background-color: #252527;
    box-shadow: 2px 2px 0 0 rgba(0,0,0,0.9), inset -2px 1px 1px -1px #000;
    position: relative;
  }
  .phone-bottom .phone-screw div:after {
    content: "";
    display: block;
    height: 4px;
    width: 4px;
    background-color: #151515;
    transform: rotate(45deg);
    position: absolute;
    top: 1px;
    box-shadow: inset -1px -1px 0 0px rgba(255,255,255,0.6);
  }
  .phone-bottom .phone-charger {
    position: absolute;
    left: 50%;
    bottom: 2px;
    background-image: linear-gradient(to right, #121214 5%, #434446 20%, #434446 60%, #7a7b80 75%, #1b1b1d 90%);
    transform: translateX(-50%) skewX(-50deg);
    height: 14px;
    width: 48px;
    overflow: hidden;
    border-radius: 15px 16px 24px 20px;
    box-shadow: 1px 1px 1px -1px rgba(255,255,255,0.4), inset -2px -2px 0 -1px #0e0e0e, inset -3px -3px 0 -1px #252527, inset 3px 3px 0 -1px #050505;
  }
  .phone-bottom .phone-charger:after {
    content: "";
    display: block;
    height: 10px;
    width: 42px;
    background-color: #050505;
    border-radius: 20px 8px 16px 10px;
    box-shadow: 1px 1px 0 -1px rgba(255,255,255,0.4);
  }
  .phone-bottom .phone-antena {
    position: absolute;
    height: 20px;
    width: 50px;
    bottom: 8px;
    left: 60px;
    border-radius: 40%;
    opacity: 0.7;
    transform: rotate(-45deg) skewX(20deg) scaleY(-1);
    background-color: transparent;
    box-shadow: 0px -2px 1px -2px #000;
  }
  .phone-bottom .phone-antena.right {
    left: auto;
    right: 70px;
    box-shadow: 0px -2px 1px -2px #000, 19px -2px 0 -2px rgba(255,255,255,0.4);
  }
  .phone-bottom .phone-antena.right:after {
    box-shadow: 0px -2px 1px -2px #000, 19px -2px 0 -2px rgba(255,255,255,0.4);
  }
  .phone-bottom .phone-antena:after {
    content: "";
    display: block;
    height: 20px;
    width: 50px;
    position: absolute;
    transform: rotate(-2deg);
    left: -3px;
    top: 3px;
    border-radius: 40%;
    background-color: transparent;
    box-shadow: 0px -2px 1px -2px #000;
  }
  .phone-reflections {
    position: absolute;
    top: -17px;
    left: 15px;
    transform: translate(-50%, -50%);
    height: 709px;
    width: 399px;
    border-radius: 48px 40px 52px 45px;
    background-color: transparent;
    z-index: 4;
    overflow: hidden;
    pointer-events: none;
  }
  .phone.no-glare .reflection-1 { display: none; }
  .phone-reflections .reflection-1 {
    position: absolute;
    height: 200%;
    width: 120%;
    background-color: #fff;
    opacity: 0.1;
    left: -320px;
    top: -200px;
    transform: rotate(32deg);
    z-index: 10;
  }
  .phone-reflections .reflection-2,
  .phone-reflections .reflection-3 {
    position: absolute;
    height: 100%;
    left: -94px;
    width: 100px;
    border-radius: 100px;
    background-color: #000;
    top: calc(50% + 14px);
    transform: translateY(-50%);
    z-index: 11;
  }
  .phone-reflections .reflection-3 {
    background: #6d6c71;
    left: -8px;
    height: 60%;
    width: 10px;
    opacity: 0.6;
    top: 70%;
  }
  .phone-reflections .reflection-4 {
    position: absolute;
    height: 60%;
    top: 0;
    background-color: #67686c;
    width: 16px;
  }
  .phone-reflections .reflection-4:before {
    content: "";
    display: block;
    position: absolute;
    height: 100px;
    width: 100px;
    background-color: transparent;
    left: 16px;
    top: 4px;
    border-radius: 44px 40px 0 0;
    box-shadow: -20px 0px 0 0 #67686c;
  }
  .phone-reflections .reflection-4:after {
    content: "";
    display: block;
    height: 80px;
    width: 80px;
    background-color: transparent;
    position: absolute;
    border-radius: 60px 0 0 0;
    left: 0px;
    top: -1px;
    transform: rotate(15deg);
    box-shadow: -25px -3px 2px -8px #000;
  }
  .phone-reflections .reflection-5 {
    position: absolute;
    height: 50%;
    bottom: 0;
    left: 4px;
    width: 12px;
    background-color: #000;
    border-radius: 50%;
  }
  .phone-reflections .reflection-6 {
    position: absolute;
    width: 80px;
    height: 20px;
    background-color: #000;
    border-radius: 50%;
    transform: rotate(40deg);
    bottom: -4px;
    left: -14px;
    z-index: 12;
  }
  .phone-reflections .reflection-6:after {
    content: "";
    display: block;
    position: absolute;
    height: 100px;
    width: 20px;
    background-color: #000;
    right: -17px;
    top: -78px;
    border-radius: 40%;
    transform: rotate(50deg);
  }
  .phone-reflections .reflection-6:before {
    content: "";
    display: block;
    position: absolute;
    height: 50px;
    width: 50px;
    background-color: transparent;
    top: -51px;
    left: 7px;
    transform: rotate(-20deg);
    border-radius: 40%;
    box-shadow: 4px 15px 1px -10px #000;
  }
  .reflection-7 {
    position: absolute;
    bottom: -4px;
    left: 10px;
    height: 20px;
    width: 40px;
    border-radius: 20px 0px 6px 10px;
    transform: skewX(60deg) skewY(-10deg) scaleY(-1) scaleX(-1) scale(0.8);
    background-color: #5c5d61;
    z-index: 13;
  }
  .reflection-7:after {
    content: "";
    display: block;
    height: 20px;
    width: 30px;
    background-color: #5c5d61;
    border-radius: 50%;
    position: absolute;
    top: -3px;
    right: 6px;
    transform: rotate(40deg) skewX(-54deg) skewY(47deg) scaleY(1) scaleX(1);
  }
  .reflection-7:before {
    content: "";
    display: block;
    position: absolute;
    height: 18px;
    width: 15px;
    background-color: #5c5d61;
    left: 6px;
    bottom: -6px;
    border-radius: 2px;
    transform: rotate(253deg) skewX(10deg);
  }

  /* The dropped screen fills the display, clipped to its rounded corners */
  .display-content {
    position: absolute;
    top: 0;
    left: 0;
    height: 690px;
    width: 378px;
    border-radius: 45px 37px 41px 41px;
    overflow: hidden;
    background: #fbfbfb;
  }
  .display-content img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: var(--fit, cover);
    object-position: var(--align, top);
  }
  .display-content img:not([src]) { display: none; }
  .empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 40px;
    color: #8a8a8a;
    font: 400 14px/1.4 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-align: center;
    text-transform: uppercase;
  }
  .display-content img[src] + .empty { display: none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="background-panels" aria-hidden="true">
      <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
    </div>
    <div class="phone" id="phone">
      <div class="phone-back">
        <div class="phone-left-side">
          <div class="phone-antena"></div>
          <div class="phone-button top"></div>
          <div class="phone-button"></div>
          <div class="phone-button bottom"></div>
          <div class="phone-antena bottom"></div>
        </div>
        <div class="phone-bottom">
          <div class="phone-antena"></div>
          <div class="bottom-speaker"><div></div><div></div><div></div><div></div><div></div><div></div></div>
          <div class="phone-screw"><div></div></div>
          <div class="phone-charger"></div>
          <div class="phone-screw right"><div></div></div>
          <div class="bottom-speaker right"><div></div><div></div><div></div><div></div><div></div><div></div></div>
          <div class="phone-antena right"></div>
        </div>
      </div>
      <div class="phone-screen"></div>
      <div class="phone-display">
        <div class="phone-notch"><div class="phone-speaker"></div></div>
        <div class="display-content">
          <img id="screen" alt="">
          <div class="empty">Drop a PNG<br>anywhere here</div>
        </div>
      </div>
      <div class="phone-reflections" aria-hidden="true">
        <div class="reflection-1"></div>
        <div class="reflection-2"></div>
        <div class="reflection-3"></div>
        <div class="reflection-4"></div>
        <div class="reflection-5"></div>
        <div class="reflection-6"></div>
        <div class="reflection-7"></div>
      </div>
    </div>
    <p class="hint">Drop a PNG on the page · or paste one (Ctrl+V)</p>
  </div>

  <aside class="panel">
    <h1>Phone mockup lab</h1>
    <p>Pure CSS phone after <a href="https://codepen.io/Wujek_Greg/pen/LmrweG" target="_blank" rel="noopener" style="color: inherit">Wujek_Greg’s pen</a>. Display is 378 × 690.</p>

    <h2>Screen</h2>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
    <div class="buttons">
      <button type="button" id="pick">Choose PNG</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <p class="file-name" id="fileName">No screen yet</p>

    <h2>Fit</h2>
    <div class="control">
      <label for="fit">Image fit</label>
      <select id="fit">
        <option value="cover">Cover (crop to fill)</option>
        <option value="contain">Contain (whole image)</option>
        <option value="fill">Stretch</option>
      </select>
    </div>
    <div class="control">
      <label for="align">Align</label>
      <select id="align">
        <option value="top">Top</option>
        <option value="center">Centre</option>
        <option value="bottom">Bottom</option>
      </select>
    </div>

    <h2>Phone</h2>
    <div class="control">
      <label for="scale">Scale</label><output id="scaleOut">0.80</output>
      <input type="range" id="scale" min="0.3" max="1.4" step="0.01" value="0.8">
    </div>
    <div class="control is-check"><input type="checkbox" id="tilt" checked><label for="tilt">Isometric tilt</label></div>
    <div class="control is-check"><input type="checkbox" id="notch" checked><label for="notch">Notch</label></div>
    <div class="control is-check"><input type="checkbox" id="glare" checked><label for="glare">Glass glare</label></div>
    <div class="control is-check"><input type="checkbox" id="panels" checked><label for="panels">Panel background</label></div>
  </aside>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), phone = $("phone"), screen = $("screen"), fileInput = $("file");
  const display = document.querySelector(".display-content");
  let url = null;

  // Settings survive a reload, in this browser only
  const KEY = "phone-lab";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const save = (patch) => { try { localStorage.setItem(KEY, JSON.stringify({ ...load(), ...patch })); } catch {} };

  function show(file) {
    if (!file || !file.type.startsWith("image/")) return;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(file);
    screen.src = url;
    screen.onload = () => {
      $("fileName").textContent = `${file.name || "Pasted image"} · ${screen.naturalWidth} × ${screen.naturalHeight}`;
    };
  }
  function clear() {
    if (url) URL.revokeObjectURL(url);
    url = null;
    screen.removeAttribute("src");
    $("fileName").textContent = "No screen yet";
  }

  // Drop anywhere on the page
  let depth = 0;
  addEventListener("dragenter", (e) => { e.preventDefault(); depth++; stage.classList.add("is-dropping"); });
  addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; stage.classList.remove("is-dropping"); } });
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", (e) => {
    e.preventDefault();
    depth = 0;
    stage.classList.remove("is-dropping");
    show([...e.dataTransfer.files].find(f => f.type.startsWith("image/")));
  });
  // Paste from the clipboard (e.g. Figma's Copy as PNG)
  addEventListener("paste", (e) => {
    const item = [...e.clipboardData.items].find(i => i.type.startsWith("image/"));
    if (item) show(item.getAsFile());
  });
  $("pick").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { show(fileInput.files[0]); fileInput.value = ""; });
  $("clear").addEventListener("click", clear);

  // Controls
  const apply = {
    fit: (v) => display.style.setProperty("--fit", v),
    align: (v) => display.style.setProperty("--align", v),
    scale: (v) => { phone.style.setProperty("--scale", v); $("scaleOut").textContent = Number(v).toFixed(2); },
    tilt: (on) => phone.classList.toggle("is-flat", !on),
    notch: (on) => phone.classList.toggle("no-notch", !on),
    glare: (on) => phone.classList.toggle("no-glare", !on),
    panels: (on) => stage.classList.toggle("is-plain", !on),
  };
  const saved = load();
  for (const [id, fn] of Object.entries(apply)) {
    const el = $(id), check = el.type === "checkbox";
    if (id in saved) check ? (el.checked = saved[id]) : (el.value = saved[id]);
    const read = () => (check ? el.checked : el.value);
    fn(read());
    el.addEventListener("input", () => { fn(read()); save({ [id]: read() }); });
  }
})();
</script>
</body>
</html>
