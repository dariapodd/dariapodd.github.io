<style>
  /* Kode Mono, self-hosted (full character set). License: fonts/OFL.txt */
  @font-face {
    font-family: "Kode Mono";
    src: url("../fonts/KodeMono.ttf") format("truetype");
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --bg: #060a01;
    --punct: #71b531;   /* keys, numbers, brackets */
    --string: #ccf79e;  /* string values */
    --accent: #8ee140;  /* current style in the selector */
    --rule: #23251f;    /* ruled lines, margin line, line numbers */
    --button: rgba(113, 181, 49, 0.2); /* #71B531 at 20% */

    --fs: 24px;
    --lh: 37px;
    --nav-fs: 16px;
    /* Left margin, shared by all views: content starts 160px after the vertical margin line */
    --margin-line: 26px;      /* vertical margin line, from the window's left edge */
    --content-left: 160px;    /* margin line → content (also the project number block's width) */
    --text-left: calc(var(--margin-line) + 1px + var(--content-left));
    --gutter: 53px;           /* right margin; also the left margin on phones */    --num-w: 74px;      /* line-number column */
    --num-gap: 36px;    /* line numbers to code */
    /* Line numbers sit inside the left margin, so the code itself starts at --text-left */
    --frame-left: max(var(--gutter), calc(var(--text-left) - var(--num-w) - var(--num-gap)));
    --ch: 0.7em;        /* one Kode Mono character incl. letter-spacing (0.6em + 0.1em) */
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }
  html { overflow-x: clip; } /* full-width ruled lines must never cause sideways scrolling */

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--punct);
    font-family: "Kode Mono", ui-monospace, monospace;
    overflow-x: hidden;
  }

  /* Vertical margin rule */
  .margin-rule {
    position: fixed;
    top: 0;
    bottom: 0;
    left: var(--margin-line);
    width: 1px;
    background: var(--rule);
    pointer-events: none;
  }

  .frame {
    width: calc(100% - var(--frame-left) - var(--gutter));
    margin-left: var(--frame-left);
    padding: 131px 0 96px;
  }

  /* ---------- "View portfolio as" selector ---------- */
  .view-select {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0 16px;
    padding: 16px 0 16px calc(var(--num-w) + var(--num-gap)); /* lines up with the code */
    margin-bottom: 64px;
    color: var(--string);
    font-size: var(--nav-fs);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .view-select a {
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
  }
  .view-select a:hover { font-weight: 600; }
  .view-select .arrow { margin-left: 5px; }

  /* ---------- Resume button, top right ---------- */
  .resume {
    position: fixed; /* stays in the corner while scrolling */
    z-index: 10;
    top: 32px;
    right: 32px;
    padding: 12px 32px;
    border-radius: 12px;
    background: var(--button);
    backdrop-filter: blur(16px); /* Figma background blur 32 */
    -webkit-backdrop-filter: blur(16px);
    color: var(--string);
    font: 400 var(--nav-fs)/1.2 "Kode Mono", ui-monospace, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
  }
  .resume:hover { font-weight: 600; }
  /* Figma: 12px radius, 100% corner smoothing. Smoothing spreads the curve over
     2x the radius, so use 24px with a squircle corner where supported. */
  @supports (corner-shape: squircle) {
    .resume {
      border-radius: 24px;
      corner-shape: squircle;
    }
  }

  /* ---------- JSON ---------- */
  .code {
    position: relative;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: var(--fs);
    line-height: var(--lh);
    letter-spacing: 0.1em;
  }

  /* Ruled lines under every visual line, full window width */
  .code::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 100vw;
    transform: translateX(-50%);
    background: repeating-linear-gradient(
      to bottom,
      transparent 0 calc(var(--lh) - 8px),
      var(--rule) calc(var(--lh) - 8px) calc(var(--lh) - 7px),
      transparent calc(var(--lh) - 7px) var(--lh)
    );
    pointer-events: none;
  }

  .code li {
    position: relative;
    display: grid;
    grid-template-columns: var(--num-w) 1fr;
    column-gap: var(--num-gap);
  }

  /* Nudge text down so letters sit on the ruled line (baseline ~2px past the line, as in the pitch view) */
  .ln, .line {
    position: relative;
    top: 4px;
  }

  .ln {
    color: var(--rule);
    text-align: right;
    user-select: none;
  }

  /* Long lines wrap like an editor: continuation lines indent 2 more characters */
  .line {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding-left: calc((var(--ind) + 2) * var(--ch));
    text-indent: calc(-2 * var(--ch));
  }

  .k, .n { color: var(--punct); }
  .s { color: var(--string); }

  /* Phones: keep the 32px text and whole lines; the code scrolls sideways like an editor,
     with line numbers pinned on the left */
  @media (max-width: 700px) {
    :root { --num-gap: 16px; --content-left: 26px; }
    .code {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .code::-webkit-scrollbar { display: none; }
    .code li {
      width: max-content;
      min-width: 100%;
    }
    .line {
      white-space: pre;
      padding-left: calc(var(--ind) * var(--ch));
      padding-right: var(--gutter);
      text-indent: 0;
    }
    .ln {
      position: sticky;
      left: 0;
      z-index: 1;
      background: var(--bg);
      box-shadow: var(--num-gap) 0 0 var(--bg); /* covers code scrolling under the gap */
    }
  }
  /* Centre capitals exactly in buttons: the line box normally reserves room for accents
     above and descenders below, which leaves caps ~1px high. Trimming the box to the cap
     height lets equal padding centre them; older browsers get a 0.5px nudge instead.
     Button height stays 43.2px either way. */
  .resume, .button, .scroll-hint { padding-top: 12.5px; padding-bottom: 11.5px; }
  @supports (text-box: trim-both cap alphabetic) {
    .resume, .button, .scroll-hint {
      text-box: trim-both cap alphabetic;
      padding-top: 15.6px;
      padding-bottom: 15.6px;
    }
  }
</style>
